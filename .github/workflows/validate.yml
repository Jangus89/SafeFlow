name: Validate SafeFlow Configuration

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  validate-json:
    name: Validate JSON Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON syntax
        run: |
          errors=0
          for file in $(find . -name "*.json" -not -path "./.git/*" -not -path "./node_modules/*"); do
            if ! python3 -m json.tool "$file" > /dev/null 2>&1; then
              echo "INVALID JSON: $file"
              python3 -m json.tool "$file" 2>&1 || true
              errors=$((errors + 1))
            fi
          done
          if [ $errors -gt 0 ]; then
            echo "$errors JSON file(s) have syntax errors"
            exit 1
          fi
          echo "All JSON files are valid"

  validate-schema:
    name: Validate Airtable Schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install jsonschema

      - name: Validate schema structure
        run: |
          python3 -c "
          import json, sys

          with open('airtable/schemas/base-schema.json') as f:
              schema = json.load(f)

          required_tables = [
              'Tenants', 'Properties', 'Maintenance Requests',
              'Contractors', 'Conversations', 'Message Log', 'Error Log'
          ]

          errors = []
          for table in required_tables:
              if table not in schema.get('tables', {}):
                  errors.append(f'Missing table: {table}')
              else:
                  fields = schema['tables'][table].get('fields', [])
                  if not fields:
                      errors.append(f'Table {table} has no fields')

          if errors:
              for e in errors:
                  print(f'ERROR: {e}')
              sys.exit(1)

          print(f'Schema valid: {len(required_tables)} tables verified')
          "

  run-tests:
    name: Run Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      - name: Run webhook tests
        run: pytest tests/webhooks/ -v

      - name: Run prompt structure tests
        run: pytest tests/prompts/ -v -m "not live"

  validate-prompts:
    name: Validate Prompt Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check prompt files have required sections
        run: |
          errors=0
          for file in prompts/system/*.md prompts/extraction/*.md prompts/generation/*.md; do
            if [ -f "$file" ]; then
              if ! grep -q "Version" "$file"; then
                echo "MISSING VERSION: $file"
                errors=$((errors + 1))
              fi
              if ! grep -q "Changelog" "$file"; then
                echo "MISSING CHANGELOG: $file"
                errors=$((errors + 1))
              fi
            fi
          done
          if [ $errors -gt 0 ]; then
            echo "$errors prompt file(s) missing required sections"
            exit 1
          fi
          echo "All prompt files have required sections"
