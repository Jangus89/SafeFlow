name: Integration Tests

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  integration-tests:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci
        working-directory: tests/integration

      - name: Run integration tests
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID_STAGING }}
          DIALOG_API_KEY: ${{ secrets.DIALOG_API_KEY_STAGING }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAKE_WEBHOOK_SCENARIO_A: ${{ secrets.MAKE_WEBHOOK_SCENARIO_A_STAGING }}
          MAKE_WEBHOOK_SCENARIO_B: ${{ secrets.MAKE_WEBHOOK_SCENARIO_B_STAGING }}
          TEST_PHONE_NUMBER: ${{ secrets.TEST_PHONE_NUMBER }}
        run: npm test
        working-directory: tests/integration

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: tests/integration/results/
          retention-days: 14

  schema-tests:
    name: Run Schema Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pytest jsonschema

      - name: Run Airtable schema tests
        run: pytest airtable/tests/ -v

      - name: Run schema validation
        run: python scripts/validation/validate-airtable-schema.py
